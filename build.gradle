plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "ParchmentMC"
		url = "https://maven.parchmentmc.org"
	}
	maven {
		name = "QuiltMC"
		url = "https://maven.quiltmc.org/repository/release"
	}
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {

	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/neo-apoli.classtweaker")

	mods {
		"neo-apoli" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {

	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.21.5:2025.06.15@zip")
	}

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//	Lombok
	compileOnly("org.projectlombok:lombok:${project.lombok_version}")
	annotationProcessor("org.projectlombok:lombok:${project.lombok_version}")

	//	QuiltMC's GSON parsers
	include(implementation("org.quiltmc.parsers:json:${project.quiltmc_parsers_version}"))
	include(implementation("org.quiltmc.parsers:gson:${project.quiltmc_parsers_version}"))

	modImplementation("dev.isxander:yet-another-config-lib:${project.yacl_version}")
	modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

}

processResources {

	filesMatching("fabric.mod.json") {

		var props = [
		    "version": project.version,
			"loader": loader_version,
			"minecraft": minecraft_version,
			"fabric": fabric_version,
			"yacl": yacl_version,
			"modmenu": modmenu_version,
			"java": java_version
		]

		expand props

	}

}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(java_version)
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(java_version)
	targetCompatibility = JavaVersion.toVersion(java_version)
}

jar {

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}

}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
